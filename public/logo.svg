<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo circular -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#334155" stroke-width="1"/>

  <!-- Linha de gráfico ascendente -->
  <polyline
    points="10,44 20,36 28,40 38,26 54,18"
    stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Pontos na linha -->
  <circle cx="20" cy="36" r="2" fill="#6366f1"/>
  <circle cx="38" cy="26" r="2" fill="#818cf8"/>
  <circle cx="54" cy="18" r="2.5" fill="#22c55e" filter="url(#glow)"/>

  <!-- Moeda (cifrão) -->
  <circle cx="16" cy="46" r="9" fill="url(#coin)" opacity="0.95"/>
  <text x="16" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#1e1b4b">$</text>

  <!-- Barra de base -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="2 2"/>
</svg>
